name: Update WNW calendar

on:
  schedule:
    - cron: "43 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: calendar-commits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4 lxml

      - name: Build calendar
        run: python scripts/build_wrexham_calendar.py

      - name: Commit if changed
        run: |
          F=docs/were-not-wrexham.ics
          [ -f "$F" ] || { echo "No calendar yet (no games found)."; exit 0; }
          if git ls-files --error-unmatch "$F" >/dev/null 2>&1 \
             && git diff --quiet -I '^DTSTAMP:' -- "$F"; then
            echo "No schedule changes."
            git checkout -- "$F"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "Update We're Not Wrexham schedule"
          git pull --rebase
          git push
